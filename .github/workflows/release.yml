name: Plugin Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Validate tag and require its commit on main
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$ ]]; then
            echo 'Release tag must use strict SemVer with a v prefix.' >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$SOURCE_REVISION" FETCH_HEAD; then
            echo 'Plugin releases must come from a commit already contained in main.' >&2
            exit 1
          fi
      - name: Validate release notes
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          notes_file=".github/release-notes/${release_version}.md"
          if [ ! -s "$notes_file" ]; then
            echo "Missing or empty release notes: $notes_file" >&2
            echo "Create the file before tagging a release." >&2
            exit 1
          fi
          if ! grep -q '^# ' "$notes_file"; then
            echo "Release notes must contain a Markdown H1 title: $notes_file" >&2
            exit 1
          fi
          if grep -Eiq 'TODO|TBD|copy[ -]paste|待补充' "$notes_file"; then
            echo "Release notes contain a placeholder; document the actual changes: $notes_file" >&2
            exit 1
          fi
      - name: Test and package
        shell: bash
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          mvn -B -ntp versions:set -DnewVersion="$release_version" -DgenerateBackupPoms=false
          mvn -B -ntp verify
      - name: Require the in-process Java Link client in the Program plugin
        shell: bash
        run: |
          jar_file=$(find link-program-plugin/target -maxdepth 1 -name '*-fat.jar' -print -quit)
          for required in \
            META-INF/jlshell-plugin.json \
            com/jlshell/link/client/LinkClientEngine.class \
            com/jlshell/link/client/RelayCarrierPlanFactory.class \
            com/jlshell/link/plugin/program/LinkClientRuntime.class \
            com/jlshell/link/internal/netty/channel/nio/NioEventLoopGroup.class \
            com/jlshell/link/internal/bouncycastle/asn1/x500/X500Name.class; do
            jar tf "$jar_file" | grep -qx "$required" || {
              echo "Plugin release is missing $required" >&2
              exit 1
            }
          done
          if jar tf "$jar_file" | grep -Eq 'META-INF/jlshell-link/runtime/|jlshell-(connector|agent)-|ConnectorProcessManager.class|LinkSessionContribution.class|LinkSessionController.class|LinkAccountClient.class|BundledRuntimeManager.class|PeerIdCodec.class|TunnelOpenRequest.class'; then
            echo "Rust Connector/Agent runtime content must not be packaged in the Java plugin" >&2
            exit 1
          fi
      - name: Prepare release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp link-program-plugin/target/*-fat.jar dist/jlshell-link-plugin.jar
          cp link-program-plugin/target/bom.json dist/dependencies.cyclonedx.json
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          namespace = "{http://maven.apache.org/POM/4.0.0}"
          pom = ET.parse("pom.xml").getroot()
          properties = pom.find(f"{namespace}properties")
          if properties is None:
              raise SystemExit("Missing Maven properties in pom.xml")

          def version(name: str) -> str:
              value = properties.find(f"{namespace}{name}")
              if value is None or not value.text:
                  raise SystemExit(f"Missing pinned Maven property: {name}")
              return value.text.strip()

          artifacts = [
              Path("dist/jlshell-link-plugin.jar"),
              Path("dist/dependencies.cyclonedx.json"),
          ]
          tag = os.environ["RELEASE_TAG"]
          manifest = {
              "schemaVersion": 1,
              "product": "jlshell-link-plugin",
              "version": tag.removeprefix("v"),
              "sourceRevision": os.environ["SOURCE_REVISION"],
              "releaseTag": tag,
              "javaMajorVersion": 21,
              "dependencies": {
                  "jlshellPluginApi": version("jlshell.plugin-api.version"),
                  "jlshellLinkJava": version("jlshell.link.version"),
                  "javafx": version("javafx.version"),
                  "gson": version("gson.version"),
              },
              "dependencySbomFormat": "CycloneDX JSON",
              "artifacts": [{
                  "name": artifact.name,
                  "sizeBytes": artifact.stat().st_size,
                  "sha256": hashlib.sha256(artifact.read_bytes()).hexdigest(),
              } for artifact in artifacts],
          }
          Path("dist/release-provenance.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          cd dist
          sha256sum jlshell-link-plugin.jar release-provenance.json > SHA256SUMS
      - name: Create private GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          notes_file=".github/release-notes/${release_version}.md"
          mapfile -d '' assets < <(find dist -maxdepth 1 -type f -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No plugin release files were produced" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$notes_file"
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
