name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read
  packages: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Test and package plugin
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -ntp verify
      - name: Verify host API is excluded from the fat JAR
        shell: bash
        run: |
          jar_file=$(find link-program-plugin/target -maxdepth 1 -name '*-fat.jar' -print -quit)
          if jar tf "$jar_file" | grep -q '^com/jlshell/plugin/api/'; then
            echo "Host Plugin API leaked into $jar_file" >&2
            exit 1
          fi
          if jar tf "$jar_file" | grep -q 'META-INF/services/com.jlshell.plugin.api.JlShellPlugin'; then
            echo "Unexpected Session plugin ServiceLoader entry in $jar_file" >&2
            exit 1
          fi
          for required_entry in \
            META-INF/jlshell-plugin.json \
            META-INF/services/com.jlshell.plugin.api.JlShellProgramPlugin; do
            if ! jar tf "$jar_file" | grep -qx "$required_entry"; then
              echo "Missing required plugin package entry $required_entry" >&2
              exit 1
            fi
          done
          for required_entry in \
            com/jlshell/link/client/LinkClientEngine.class \
            com/jlshell/link/client/RelayCarrierPlanFactory.class \
            com/jlshell/link/plugin/program/LinkClientRuntime.class \
            com/jlshell/link/internal/netty/channel/nio/NioEventLoopGroup.class; do
            if ! jar tf "$jar_file" | grep -qx "$required_entry"; then
              echo "Missing in-process Java Link runtime class $required_entry" >&2
              exit 1
            fi
          done
          if jar tf "$jar_file" | grep -Eq 'META-INF/jlshell-link/runtime/|jlshell-(connector|agent)-|ConnectorProcessManager.class|LinkSessionContribution.class|LinkSessionController.class|LinkAccountClient.class|BundledRuntimeManager.class|PeerIdCodec.class|TunnelOpenRequest.class'; then
            echo "Legacy Connector/Agent runtime content must not be packaged in the Java plugin" >&2
            exit 1
          fi
          if [ "$(find link-plugin-distribution/target/plugins -maxdepth 1 -name '*.jar' | wc -l | tr -d ' ')" != "1" ]; then
            echo "Distribution must contain exactly one Program plugin JAR" >&2
            exit 1
          fi
